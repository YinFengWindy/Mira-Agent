[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-status-commands"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-agent==0.1.0"]

[project.optional-dependencies]
test = ["shiori-plugin-testkit==0.1.0", "shiori-plugin-observe==0.1.0"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.status_commands", "plugins.status_commands.backend"]
package-dir = {"plugins.status_commands" = "."}

[tool.setuptools.package-data]
"plugins.status_commands" = ["manifest.yaml", "TESTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-plugin-testkit"]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiori-plugin-default-memory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["shiori-agent==0.1.0"]

[project.optional-dependencies]
test = ["shiori-plugin-testkit==0.1.0"]

[tool.setuptools]
include-package-data = false
packages = ["plugins.default_memory", "plugins.default_memory.backend", "plugins.default_memory.backend.engine"]
package-dir = {"plugins.default_memory" = "."}

[tool.setuptools.package-data]
"plugins.default_memory" = ["manifest.yaml", "TESTING.md", "backend/**/*.json", "backend/**/*.yaml", "backend/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-W error --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
required_plugins = ["pytest-asyncio", "shiori-plugin-testkit"]
